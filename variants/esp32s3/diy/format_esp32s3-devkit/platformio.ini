
[env:format_esp32s3-devkit]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
;board_upload.flash_size = 16MB ;Specify the FLASH capacity as 16MB
board_build.flash_mode = qio               ; Flash模式：QIO
board_build.psram_type = opi               ; PSRAM类型：OPI（8MB PSRAM对应OPI模式）

; Flash容量配置
board_upload.flash_size = 16MB             ; Flash总容量16MB
board_upload.maximum_size = 16777216       ; 16MB对应的字节数（16*1024*1024）
board_build.partitions = default_16MB.csv  ; 16MB Flash对应的分区表


lib_deps = ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

build_unflags =
  ${esp32s3_base.build_unflags}
build_flags =
  ${esp32s3_base.build_flags}
  -D FORMAT_ESP32S3_DEVKIT
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  ;-D OLED_CN
  -I variants/esp32s3/diy/format_esp32s3-devkit
; 启用PSRAM编译宏
board_build.extra_flags = -DBOARD_HAS_PSRAM
upload_speed = 921600